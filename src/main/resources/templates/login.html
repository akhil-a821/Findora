<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">

<head>
    <title>Log In — Findora</title>
</head>

<body>
    <div th:fragment="content" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card login-card-animated p-4 p-md-5 border-0">
                        <div class="text-center mb-4">
                            <div class="login-icon-glow mb-3">
                                <i class="fa-solid fa-right-to-bracket fa-xl"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Welcome Back</h3>
                            <p class="text-muted small">Log in to manage your lost &amp; found reports</p>
                        </div>

                        <div th:if="${param.error}"
                            class="alert alert-danger py-2 small mb-3 animate__animated animate__headShake">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i> Invalid college email or password.
                            Please try again.
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3">
                            <i class="fa-solid fa-circle-check me-1"></i> You have been logged out successfully.
                        </div>

                        <form th:action="@{/login}" method="post" id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark">College Email</label>
                                <div class="input-group animated-input-group">
                                    <span class="input-group-text bg-white border-0"><i
                                            class="fa-regular fa-envelope text-muted"></i></span>
                                    <input type="email" name="username"
                                        class="form-control border-0 bg-transparent ps-0"
                                        placeholder="yourname@campus.edu" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold text-dark">Password</label>
                                <div class="input-group animated-input-group">
                                    <span class="input-group-text bg-white border-0"><i
                                            class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" name="password"
                                        class="form-control border-0 bg-transparent ps-0" placeholder="••••••••"
                                        required>
                                </div>
                            </div>

                            <button type="submit" id="loginSubmitBtn" class="btn btn-login-animated w-100 mb-3">
                                <span id="btnText"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Log In</span>
                            </button>
                        </form>

                        <div class="text-center border-top pt-3">
                            <p class="text-muted small mb-0">Don't have an account? <a th:href="@{/register}"
                                    class="text-primary font-weight-bold text-decoration-none">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
