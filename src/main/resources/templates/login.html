<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">

<head>
    <title>Log In — Findora</title>
</head>

<body>
    <div th:fragment="content" class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card sleek-card p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="sleek-icon-wrapper mb-3">
                                <i class="fa-solid fa-compass fa-lg"></i>
                            </div>
                            <h4 class="fw-bold mb-1">Welcome Back</h4>
                            <p class="text-muted small">Log in to manage your lost &amp; found reports</p>
                        </div>

                        <div th:if="${param.error}"
                            class="alert alert-danger py-2 small mb-3">
                            <i class="fa-solid fa-triangle-exclamation me-1"></i> Invalid college email or password.
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3">
                            <i class="fa-solid fa-circle-check me-1"></i> You have been logged out successfully.
                        </div>

                        <div th:if="${successMessage}" class="alert alert-success py-2 small mb-3">
                            <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${successMessage}">Operation completed successfully.</span>
                        </div>

                        <form th:action="@{/login}" method="post" id="loginForm">
                            <div class="form-floating mb-3">
                                <input type="email" name="username" class="form-control sleek-input" id="floatingEmail" placeholder="yourname@campus.edu" required autofocus>
                                <label for="floatingEmail" class="text-muted"><i class="fa-regular fa-envelope me-2"></i>College Email</label>
                            </div>

                            <div class="form-floating mb-2">
                                <input type="password" name="password" class="form-control sleek-input" id="floatingPassword" placeholder="Password" required>
                                <label for="floatingPassword" class="text-muted"><i class="fa-solid fa-lock me-2"></i>Password</label>
                            </div>

                            <div class="d-flex justify-content-end mb-4">
                                <a th:href="@{/forgot-password}" class="small text-decoration-none fw-semibold forgot-password-link" style="color: var(--primary);">
                                    Forgot password?
                                </a>
                            </div>

                            <button type="submit" id="loginSubmitBtn" class="btn btn-sleek-primary w-100 mb-4 py-2">
                                Log In
                            </button>
                        </form>

                        <div class="text-center pt-2">
                            <p class="text-muted small mb-0">Don't have an account? <a th:href="@{/register}"
                                    class="fw-semibold text-decoration-none" style="color: var(--primary-color);">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
