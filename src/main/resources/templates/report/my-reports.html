<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>My Reports — CampusFind</title>
</head>
<body>
<div th:fragment="content" class="py-4">
    <div class="container">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">My Reports</h2>
                <p class="text-muted mb-0">Manage all lost and found reports you've posted.</p>
            </div>
            <a th:href="@{/report}" class="btn btn-primary-custom"><i class="fa-solid fa-plus me-1"></i> New Report</a>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(reports)}" class="empty-state">
            <div class="empty-state-icon"><i class="fa-solid fa-folder-open"></i></div>
            <h4 class="fw-bold mb-2">No reports created yet</h4>
            <p class="text-muted mb-4">You haven't reported any lost or found items.</p>
            <a th:href="@{/report}" class="btn btn-primary-custom">Create First Report</a>
        </div>

        <!-- Reports Table / Grid -->
        <div th:if="${!#lists.isEmpty(reports)}" class="row g-4">
            <div th:each="r : ${reports}" class="col-md-6 col-lg-4">
                <div class="card card-custom h-100">
                    <div class="card-img-wrapper">
                        <img th:src="${r.imageUrl != null ? r.imageUrl : '/images/placeholder-default.svg'}" th:alt="${r.itemName}">
                        <div class="position-absolute top-0 start-0 p-3">
                            <span class="badge badge-custom" th:classappend="${r.type.name() == 'LOST' ? 'badge-lost' : 'badge-found'}" th:text="${r.type.name()}">LOST</span>
                        </div>
                        <div class="position-absolute top-0 end-0 p-3">
                            <span class="badge bg-dark text-white" th:text="${r.status.name()}">ACTIVE</span>
                        </div>
                    </div>
                    <div class="card-body p-4 d-flex flex-column">
                        <h5 class="fw-bold mb-2" th:text="${r.itemName}">Item Name</h5>
                        <p class="text-muted small flex-grow-1" th:text="${#strings.abbreviate(r.description, 80)}">Description...</p>
                        
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-auto">
                            <span class="text-muted small"><i class="fa-solid fa-location-dot me-1"></i> <span th:text="${r.location}">Location</span></span>
                            
                            <div class="d-flex gap-2">
                                <a th:href="@{'/item/' + ${r.id}}" class="btn btn-outline-custom btn-sm">View</a>
                                <form th:action="@{'/reports/delete/' + ${r.id}}" method="post" onsubmit="return confirm('Are you sure you want to delete this report?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
