<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Browse Lost &amp; Found — CampusFind</title>
</head>
<body>
<div th:fragment="content" class="py-4">
    <div class="container">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold mb-1">Campus Lost &amp; Found</h2>
            <p class="text-muted">Search reported items across your college campus.</p>
        </div>

        <!-- Search & Filters Bar -->
        <div class="card card-custom p-4 border-0 mb-4 shadow-sm">
            <form th:action="@{/browse}" method="get" class="row g-3">
                
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                        <input type="text" name="query" th:value="${searchQuery}" class="form-control bg-light border-start-0" placeholder="Search item name, brand, details...">
                    </div>
                </div>

                <div class="col-6 col-md-2">
                    <select name="type" class="form-select bg-light">
                        <option value="ALL" th:selected="${selectedType == 'ALL'}">All Types</option>
                        <option value="LOST" th:selected="${selectedType == 'LOST'}">Lost Items</option>
                        <option value="FOUND" th:selected="${selectedType == 'FOUND'}">Found Items</option>
                    </select>
                </div>

                <div class="col-6 col-md-3">
                    <select name="category" class="form-select bg-light">
                        <option value="ALL" th:selected="${selectedCategory == 'ALL'}">All Categories</option>
                        <option value="Electronics" th:selected="${selectedCategory == 'Electronics'}">Electronics</option>
                        <option value="Wallet" th:selected="${selectedCategory == 'Wallet'}">Wallet</option>
                        <option value="Keys" th:selected="${selectedCategory == 'Keys'}">Keys</option>
                        <option value="ID Card" th:selected="${selectedCategory == 'ID Card'}">ID Card</option>
                        <option value="Documents" th:selected="${selectedCategory == 'Documents'}">Documents</option>
                        <option value="Books" th:selected="${selectedCategory == 'Books'}">Books</option>
                        <option value="Bags" th:selected="${selectedCategory == 'Bags'}">Bags</option>
                        <option value="Other" th:selected="${selectedCategory == 'Other'}">Other</option>
                    </select>
                </div>

                <div class="col-6 col-md-2">
                    <select name="location" class="form-select bg-light">
                        <option value="ALL" th:selected="${selectedLocation == 'ALL'}">All Locations</option>
                        <option value="Library" th:selected="${selectedLocation == 'Library'}">Library</option>
                        <option value="Canteen" th:selected="${selectedLocation == 'Canteen'}">Canteen</option>
                        <option value="Computer Lab" th:selected="${selectedLocation == 'Computer Lab'}">Computer Lab</option>
                        <option value="Main Gate" th:selected="${selectedLocation == 'Main Gate'}">Main Gate</option>
                        <option value="Auditorium" th:selected="${selectedLocation == 'Auditorium'}">Auditorium</option>
                        <option value="Playground" th:selected="${selectedLocation == 'Playground'}">Playground</option>
                    </select>
                </div>

                <div class="col-6 col-md-1 d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom w-100"><i class="fa-solid fa-filter"></i></button>
                    <a th:href="@{/browse}" class="btn btn-outline-secondary" title="Reset Filters"><i class="fa-solid fa-rotate-left"></i></a>
                </div>
            </form>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(reports)}" class="empty-state">
            <div class="empty-state-icon"><i class="fa-solid fa-box-open"></i></div>
            <h4 class="fw-bold mb-2">No reports found</h4>
            <p class="text-muted mb-4">No lost or found items match your current search and filter selection.</p>
            <a th:href="@{/report}" class="btn btn-primary-custom"><i class="fa-solid fa-plus me-1"></i> Submit New Report</a>
        </div>

        <!-- Items Grid -->
        <div class="row g-4" th:if="${!#lists.isEmpty(reports)}">
            <div th:each="r : ${reports}" class="col-md-6 col-lg-4">
                <div class="card card-custom h-100">
                    <div class="card-img-wrapper">
                        <img th:src="${r.imageUrl != null ? r.imageUrl : '/images/placeholder-default.svg'}" th:alt="${r.itemName}" alt="Item image">
                        <div class="position-absolute top-0 start-0 p-3">
                            <span class="badge badge-custom" th:classappend="${r.type.name() == 'LOST' ? 'badge-lost' : 'badge-found'}">
                                <i th:classappend="${r.type.name() == 'LOST' ? 'fa-circle-exclamation' : 'fa-circle-check'}" class="fa-solid me-1"></i>
                                <span th:text="${r.type.name()}">LOST</span>
                            </span>
                        </div>
                        <div class="position-absolute top-0 end-0 p-3">
                            <span class="badge bg-dark bg-opacity-75 text-white" th:text="${r.status.name()}">ACTIVE</span>
                        </div>
                    </div>

                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title fw-bold mb-0 text-truncate" th:text="${r.itemName}">Item Name</h5>
                        </div>

                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <span class="badge bg-light text-dark border"><i class="fa-solid fa-tag me-1 text-primary"></i> <span th:text="${r.category}">Category</span></span>
                            <span class="badge bg-light text-dark border"><i class="fa-solid fa-location-dot me-1 text-danger"></i> <span th:text="${r.location}">Location</span></span>
                        </div>

                        <p class="card-text text-muted small flex-grow-1" th:text="${#strings.abbreviate(r.description, 90)}">Item description snippet...</p>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-auto">
                            <span class="text-muted small"><i class="fa-regular fa-calendar me-1"></i> <span th:text="${#temporals.format(r.date, 'MMM dd, yyyy')}">Date</span></span>
                            <a th:href="@{'/item/' + ${r.id}}" class="btn btn-outline-custom btn-sm fw-semibold">View Details <i class="fa-solid fa-chevron-right ms-1"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
