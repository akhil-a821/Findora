<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Create Account — Findora</title>
</head>
<body>
<div th:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-custom p-4 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="fa-solid fa-user-plus fa-xl"></i>
                        </div>
                        <h3 class="fw-bold">Create Campus Account</h3>
                        <p class="text-muted small">Join Findora to report lost items or reunite found belongings</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userRegistrationDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                                <input type="text" th:field="*{name}" class="form-control bg-light border-start-0" placeholder="e.g. John Doe" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">College Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                                <input type="email" th:field="*{email}" class="form-control bg-light border-start-0" placeholder="yourname@campus.edu" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email Error</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" th:field="*{password}" class="form-control bg-light border-start-0" placeholder="At least 6 characters" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                                <input type="password" th:field="*{confirmPassword}" class="form-control bg-light border-start-0" placeholder="Re-enter password" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm Password Error</div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Register Account</button>
                    </form>

                    <div class="text-center border-top pt-3">
                        <p class="text-muted small mb-0">Already have an account? <a th:href="@{/login}" class="text-primary font-weight-bold text-decoration-none">Log in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
