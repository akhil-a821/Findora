<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Create Account — Findora</title>
</head>
<body>
<div th:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card sleek-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="sleek-icon-wrapper mb-3">
                            <i class="fa-solid fa-user-plus fa-lg"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Create Account</h4>
                        <p class="text-muted small">Join Findora to report or reunite belongings</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userRegistrationDto}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" th:field="*{name}" class="form-control sleek-input" id="floatingName" placeholder="e.g. John Doe" required>
                            <label for="floatingName" class="text-muted"><i class="fa-regular fa-user me-2"></i>Full Name</label>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" th:field="*{email}" class="form-control sleek-input" id="floatingEmail" placeholder="yourname@campus.edu" required>
                            <label for="floatingEmail" class="text-muted"><i class="fa-regular fa-envelope me-2"></i>College Email</label>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" th:field="*{password}" class="form-control sleek-input" id="floatingPassword" placeholder="At least 6 characters" required>
                            <label for="floatingPassword" class="text-muted"><i class="fa-solid fa-lock me-2"></i>Password</label>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" th:field="*{confirmPassword}" class="form-control sleek-input" id="floatingConfirm" placeholder="Re-enter password" required>
                            <label for="floatingConfirm" class="text-muted"><i class="fa-solid fa-shield-halved me-2"></i>Confirm Password</label>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" id="registerSubmitBtn" class="btn btn-sleek-primary w-100 mb-4 py-2">
                            Register Account
                        </button>
                    </form>

                    <div class="text-center pt-2">
                        <p class="text-muted small mb-0">Already have an account? <a th:href="@{/login}" class="fw-semibold text-decoration-none" style="color: var(--primary-color);">Log in here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
