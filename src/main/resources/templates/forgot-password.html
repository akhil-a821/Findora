<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Reset Password — Findora</title>
</head>
<body>
<div th:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card sleek-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="sleek-icon-wrapper mb-3">
                            <i class="fa-solid fa-key fa-lg"></i>
                        </div>
                        <h4 class="fw-bold mb-1">Reset Password</h4>
                        <p class="text-muted small">Enter your college email and set a new password</p>
                    </div>

                    <form th:action="@{/forgot-password}" th:object="${passwordResetDto}" method="post" id="resetPasswordForm">
                        <div class="form-floating mb-3">
                            <input type="email" th:field="*{email}" class="form-control sleek-input" id="floatingResetEmail" placeholder="yourname@campus.edu" required autofocus>
                            <label for="floatingResetEmail" class="text-muted"><i class="fa-regular fa-envelope me-2"></i>College Email</label>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" th:field="*{newPassword}" class="form-control sleek-input" id="floatingNewPassword" placeholder="At least 6 characters" required>
                            <label for="floatingNewPassword" class="text-muted"><i class="fa-solid fa-lock me-2"></i>New Password</label>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" th:field="*{confirmPassword}" class="form-control sleek-input" id="floatingConfirmPassword" placeholder="Confirm new password" required>
                            <label for="floatingConfirmPassword" class="text-muted"><i class="fa-solid fa-shield-halved me-2"></i>Confirm Password</label>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" id="resetSubmitBtn" class="btn btn-sleek-primary w-100 mb-4 py-2">
                            Reset Password
                        </button>
                    </form>

                    <div class="text-center pt-2">
                        <p class="text-muted small mb-0">
                            Remember your password? <a th:href="@{/login}" class="fw-semibold text-decoration-none" style="color: var(--primary);"><i class="fa-solid fa-arrow-left me-1"></i> Back to Log In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
