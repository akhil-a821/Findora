<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Error — CampusFind</title>
</head>
<body>
<div th:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card card-custom p-5 border-0 shadow-lg">
                    <div class="text-danger mb-3"><i class="fa-solid fa-triangle-exclamation fa-4x"></i></div>
                    <h2 class="fw-bold mb-2" th:text="${errorCode != null ? errorCode : 'An Error Occurred'}">Error</h2>
                    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested page or resource could not be found.'}">Something went wrong.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/}" class="btn btn-primary-custom"><i class="fa-solid fa-house me-1"></i> Go to Homepage</a>
                        <a th:href="@{/dashboard}" class="btn btn-outline-custom">Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
